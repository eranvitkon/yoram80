services:
  - type: web
    name: yoram80
    env: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: yoram80-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: SITE_URL
        value: https://yoram80.onrender.com
      - key: DATA_DIR
        value: /data
